<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ismail's Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: white; scroll-behavior: smooth; }
        
        /* Header & Profile Image */
        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #0f172a; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #f39c12; margin-bottom: 20px; object-fit: cover; }
        header h1 { font-size: 3rem; color: #f39c12; }
        header p { font-size: 1.2rem; opacity: 0.8; margin-bottom: 20px; }

        /* Social Icons */
        .social-links a { color: white; font-size: 1.5rem; margin: 0 15px; transition: 0.3s; text-decoration: none; }
        .social-links a:hover { color: #f39c12; }

        /* Projects */
        .container { padding: 80px 20px; max-width: 1100px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 50px; color: #f39c12; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .project-card { background: #1e293b; padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .project-card:hover { border-color: #f39c12; transform: translateY(-5px); transition: 0.3s; }
        .btn { display: inline-block; padding: 10px 20px; background: #f39c12; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; font-weight: bold; }

        /* Contact Form */
        .contact-form { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 15px; }
        .contact-form input, .contact-form textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 5px; border: none; outline: none; }
        .contact-form button { width: 100%; padding: 12px; background: #f39c12; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="profile-img">
        <h1>আমি ইসমাইল হোসেন</h1>
        <p>জুনিয়র ওয়েব ডেভেলপার</p>
        <div class="social-links">
            <a href="https://facebook.com/your-profile" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://wa.me/your-number" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://github.com/ismailhossainjnu0-png" target="_blank"><i class="fab fa-github"></i></a>
        </div>
    </header>

    <div class="container" id="projects">
        <h2 class="section-title">আমার প্রজেক্টস</h2>
        <div class="project-grid">
            <div class="project-card">
                <h3>ডিজিটাল ভিজিটিং কার্ড</h3>
                <a href="https://ismailhossainjnu0-png.github.io/Visiting-card/" class="btn" target="_blank">ওপেন করুন</a>
            </div>
            <div class="project-card">
                <h3>বয়স ক্যালকুলেটর</h3>
                <a href="https://codepen.io/ojgwyfdh-the-builder/pen/OPXREBK" class="btn" target="_blank">ওপেন করুন</a>
            </div>
            <div class="project-card">
                <h3>স্মার্ট ক্যালকুলেটর</h3>
                <a href="https://ismailhossainjnu0-png.github.io/my-calculator/" class="btn" target="_blank">ওপেন করুন</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">মেসেজ দিন</h2>
        <form class="contact-form">
            <input type="text" placeholder="আপনার নাম" required>
            <input type="email" placeholder="আপনার ইমেইল" required>
            <textarea rows="5" placeholder="মেসেজ লিখুন..." required></textarea>
            <button type="submit">মেসেজ পাঠান</button>
        </form>
    </div>

    <footer style="text-align: center; padding: 40px; opacity: 0.6;">
        <p>&copy; 2026 ইসমাইল হোসেন | নতুন ডেভেলপার</p>
    </footer>

</body>
</html>
