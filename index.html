<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইসমাইল হোসেন - পোর্টফোলিও</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: white; line-height: 1.6; }
        header { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(to bottom, #1e293b, #0f172a); padding: 20px; }
        
        /* ঘড়ির স্টাইল */
        #clock {
            font-size: 1.5rem;
            color: #f39c12;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            border: 1px solid #f39c12;
            letter-spacing: 2px;
        }

        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #f39c12; margin-bottom: 15px; object-fit: cover; box-shadow: 0 0 15px rgba(243, 156, 18, 0.5); }
        header h1 { font-size: 2.5rem; color: #f39c12; margin-bottom: 10px; }
        header p { font-size: 1.2rem; opacity: 0.8; margin-bottom: 20px; }
        .social-links a { color: white; font-size: 1.8rem; margin: 0 15px; transition: 0.3s; }
        .social-links a:hover { color: #f39c12; }
        .container { padding: 50px 20px; max-width: 1100px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 40px; color: #f39c12; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .project-card { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .project-card:hover { transform: translateY(-10px); border-color: #f39c12; }
        .project-card i { font-size: 2.5rem; color: #f39c12; margin-bottom: 15px; }
        .btn { display: inline-block; padding: 10px 25px; background: #f39c12; color: white; text-decoration: none; border-radius: 30px; font-weight: bold; margin-top: 10px; }
        footer { text-align: center; padding: 40px; background: #0b1121; margin-top: 40px; opacity: 0.7; }
    </style>
</head>
<body>

    <header>
        <div id="clock">00:00:00 PM</div>

        <img src="ismail.jpg" alt="Ismail" class="profile-img">
        <h1>ইসমাইল হোসেন</h1>
        <p>জুনিয়র ওয়েব ডেভেলপার</p>
        
        <div class="social-links">
            <a href="https://facebook.com/ismailhossainjnu" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://wa.me/8801515295944" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://github.com/ismailhossainjnu0-png" target="_blank"><i class="fab fa-github"></i></a>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">আমার তৈরি প্রজেক্টসমূহ</h2>
        <div class="project-grid">
            <div class="project-card">
                <i class="fas fa-id-card"></i>
                <h3>ভিজিটিং কার্ড</h3>
                <a href="https://ismailhossainjnu0-png.github.io/Visiting-card/" class="btn" target="_blank">লাইভ দেখুন</a>
            </div>
            <div class="project-card">
                <i class="fas fa-calculator"></i>
                <h3>স্মার্ট ক্যালকুলেটর</h3>
                <a href="https://ismailhossainjnu0-png.github.io/my-calculator/" class="btn" target="_blank">লাইভ দেখুন</a>
            </div>
            <div class="project-card">
                <i class="fas fa-birthday-cake"></i>
                <h3>বয়স ক্যালকুলেটর</h3>
                <a href="https://codepen.io/ojgwyfdh-the-builder/pen/OPXREBK" class="btn" target="_blank">লাইভ দেখুন</a>
            </div>
            <div class="project-card">
                <i class="fas fa-shopping-cart"></i>
                <h3>মার্কেট লিস্ট অ্যাপ</h3>
                <a href="https://ismailhossainjnu0-png.github.io/smart-bazar/" class="btn" target="_blank">লাইভ দেখুন</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ইসমাইল হোসেন</p>
    </footer>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 কে 12 বানাবে
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('clock').innerHTML = hours + ":" + minutes + ":" + seconds + " " + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock(); // পেজ লোড হওয়ার সাথে সাথে দেখানোর জন্য
    </script>

</body>
</html>
