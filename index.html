    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('clock').innerHTML = hours + ":" + minutes + ":" + seconds + " " + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game 🐍</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            touch-action: none; /* মোবাইলে স্ক্রলিং বন্ধ রাখার জন্য */
        }
        h1 { margin: 10px 0; }
        #score-container { font-size: 18px; margin-bottom: 10px; color: #555; }
        canvas {
            background-color: black;
            border: 5px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            max-width: 90vw;
            max-height: 70vh;
        }
        #restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #restart-btn:active { background-color: #27ae60; }
    </style>
</head>
<body>

    <h1>Snake Game 🐍</h1>
    <div id="score-container">Use Arrow Keys or Swipe! Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <button id="restart-btn" onclick="resetGame()">Restart Game</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const box = 20;
        let snake, food, score, direction, game;

        function init() {
            snake = [{ x: 10 * box, y: 10 * box }];
            food = {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
            score = 0;
            direction = "";
            scoreElement.innerHTML = score;
            if (game) clearInterval(game);
            game = setInterval(draw, 150);
        }

        // কিবোর্ড কন্ট্রোল
        document.addEventListener("keydown", (e) => {
            if (e.keyCode == 37 && direction != "RIGHT") direction = "LEFT";
            else if (e.keyCode == 38 && direction != "DOWN") direction = "UP";
            else if (e.keyCode == 39 && direction != "LEFT") direction = "RIGHT";
            else if (e.keyCode == 40 && direction != "UP") direction = "DOWN";
        });

        // মোবাইল সোয়াইপ কন্ট্রোল
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);

        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction != "LEFT") direction = "RIGHT";
                else if (dx < 0 && direction != "RIGHT") direction = "LEFT";
            } else {
                if (dy > 0 && direction != "UP") direction = "DOWN";
                else if (dy < 0 && direction != "DOWN") direction = "UP";
            }
        }, false);

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // সাপ ড্র করা
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#2ecc71" : "#27ae60"; // মাথা এবং শরীর
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "black";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // খাবার ড্র করা
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (direction == "LEFT") snakeX -= box;
            if (direction == "UP") snakeY -= box;
            if (direction == "RIGHT") snakeX += box;
            if (direction == "DOWN") snakeY += box;

            // খাবার খাওয়া চেক করা
            if (snakeX == food.x && snakeY == food.y) {
                score++;
                scoreElement.innerHTML = score;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // গেম ওভার কন্ডিশন
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("গেম ওভার! আপনার স্কোর: " + score);
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function resetGame() {
            init();
        }

        init();
    </script>
</body>
</html>
