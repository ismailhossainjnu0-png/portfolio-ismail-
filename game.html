<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মিনি গেম - ইসমাইল হোসেন</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 60px; margin: 10px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 সংখ্যা অনুমান গেম</h2>
        <p>১ থেকে ২০ এর মধ্যে একটি সংখ্যা লিখুন</p>
        <input type="number" id="guess" min="1" max="20">
        <button onclick="play()">চেক করুন</button>
        <p id="msg"></p>
        <br>
        <a href="index.html" style="color: #666; text-decoration: none;">← সাইটে ফিরে যান</a>
    </div>

    <script>
        let target = Math.floor(Math.random() * 20) + 1;
        function play() {
            let user = document.getElementById('guess').value;
            let m = document.getElementById('msg');
            if(user == target) {
                m.innerHTML = "🎉 অভিনন্দন! সঠিক হয়েছে।"; m.style.color = "green";
            } else {
                m.innerHTML = user > target ? "📈 একটু বেশি!" : "📉 একটু কম!"; m.style.color = "red";
            }
        }
    </script>
</body>
</html>
